<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Documento - Hospital de Clínicas</title>
  <!-- Usa el mismo archivo CSS que usas para la página de cargar -->
  <link rel="stylesheet" href="CSS/cargarnuevodoc.css">
</head>
<body>

  <div class="contenedor">
    <!-- BARRA SUPERIOR -->
    <header class="barra-superior">
      <a href="./documents.html" class="btn-volver" style="text-decoration: none; color: white;">
        <span>←</span> Volver a Documentos
      </a>
      <div class="logo-titulo">
        <img src="Elements/Icons/hospital-logo.png" alt="Logo Hospital" class="img-logo">
        <h1>EDITAR DOCUMENTO</h1>
      </div>
      <div style="width: 150px;"></div> 
    </header>

    <!-- FORMULARIO CENTRAL -->
    <main class="contenedor-formulario">
      <form id="formulario-edicion" class="tarjeta-formulario" method="POST" action="actualizar_doc.php" enctype="multipart/form-data">
        
        <div class="encabezado-seccion">
          <span class="indicador-morado"></span>
          <h2>MODIFICAR DATOS</h2>
        </div>

        <!-- CAMPO OCULTO: Vital para decirle a PHP qué fila de la base de datos modificar -->
        <input type="hidden" name="id_documento" value="1">

        <div class="grupo-input">
          <label for="nombre">Nombre del documento:</label>
          <!-- El atributo 'value' simula el dato que PHP traerá de la base de datos -->
          <input type="text" id="nombre" name="nombre" class="input-formulario" value="Indicaciones de interrupción voluntaria..." required>
        </div>

        <div class="grupo-input">
          <label for="fecha">Fecha:</label>
          <input type="date" id="fecha" name="fecha" class="input-formulario" value="2026-08-27" required>
        </div>

        <div class="grupo-input">
          <label for="categoria">Categoría:</label>
          <select id="categoria" name="categoria" class="input-formulario" required>
            <option value="informe">Informe Médico</option>
            <option value="estudio" selected>Estudio de Laboratorio</option>
            <option value="administrativo">Documento Administrativo</option>
          </select>
        </div>

        <div class="grupo-input">
          <label>Reemplazar archivo adjunto (Opcional):</label>
          <div class="area-subida" id="area-subida">
            <img src="Elements/Icons/folder-icon.svg" alt="Subir" style="width: 40px; margin-bottom: 10px;">
            <p id="texto-archivo">Archivo actual: documento_vigente.pdf<br><br>Haz clic aquí solo si deseas subir un archivo nuevo</p>
            <!-- A diferencia del form de carga, este input NO lleva el atributo 'required' -->
            <input type="file" id="archivo" name="archivo" class="input-archivo" accept=".pdf, .docx, .jpg, .png">
          </div>
        </div>

        <hr class="linea-divisora">

        <div class="botones-formulario">
          <a href="documents.html" class="btn-cancelar">Cancelar</a>
          <button type="submit" class="btn-guardar">Guardar Cambios</button>
        </div>

      </form>
    </main>
  </div>

</body>
</html>
